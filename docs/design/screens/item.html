<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshot — Item</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6E6E}a:hover{color:#084A4A}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F4EF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1C1B19">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 380px; background: #DCE6E4; display: flex; align-items: center; justify-content: center">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-opacity="0.3" stroke-width="1.2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M21 16l-5-5-8 8"></path></svg>
    <div style="position: absolute; left: 20px; right: 20px; top: 20px; display: flex; justify-content: space-between">
      <a href="location.html" aria-label="Back to Garage" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <button aria-label="More actions, including delete" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#1C1B19" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      </button>
    </div>
    <div style="position: absolute; left: 20px; bottom: 44px; display: flex; gap: 8px">
      <span style="width: 48px; height: 48px; border-radius: 12px; background: #C9D9D6; border: 2px solid #FFFFFF; box-sizing: border-box"></span>
      <span style="width: 48px; height: 48px; border-radius: 12px; background: #E9E4D6; opacity: 0.85"></span>
      <span style="width: 48px; height: 48px; border-radius: 12px; background: #EFE9DC; opacity: 0.85"></span>
    </div>
    <span style="position: absolute; right: 20px; bottom: 54px; height: 28px; padding: 0 12px; border-radius: 14px; background: rgba(28,27,25,0.7); color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center">1 / 3</span>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 352px; bottom: 0; background: #F6F4EF; border-radius: 28px 28px 0 0; padding: 26px 20px 0 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">Winter tyres</h1>
      <a href="location.html" style="align-self: flex-start; height: 36px; padding: 0 14px 0 10px; border-radius: 18px; background: #DCEDEA; color: #0B5555; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
        Garage › Shelf 2
      </a>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 18px; background: #FFFFFF; border-radius: 20px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; font-weight: 600; color: #5F5B53">Quantity</span>
        <span style="font-size: 22px; font-weight: 800">4</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button aria-label="Decrease quantity" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E4DFD4; background: #F6F4EF; font-size: 22px; font-weight: 600; color: #1C1B19">−</button>
        <button aria-label="Increase quantity" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #0F6E6E; font-size: 22px; font-weight: 600; color: #FFFFFF">+</button>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <span style="height: 32px; padding: 0 14px; border-radius: 16px; background: #0277BD; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center">Car</span>
      <span style="height: 32px; padding: 0 14px; border-radius: 16px; background: #4E342E; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center">Seasonal</span>
      <button style="height: 32px; padding: 0 14px; border-radius: 16px; border: 1px dashed #B9B2A4; background: transparent; color: #5F5B53; font-size: 13px; font-weight: 600">+ Tag</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; color: #5F5B53">Notes</span>
      <p style="margin: 0; font-size: 15px; line-height: 1.5">Nokian Hakkapeliitta 205/55 R16 on steel rims. Swap in late October; check tread depth before fitting.</p>
      <span style="font-size: 12px; color: #5F5B53">Added 2 Mar 2026</span>
    </div>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <a href="pick-location.html" style="height: 54px; box-sizing: border-box; border-radius: 27px; border: 1px solid #D9D3C6; background: #FFFFFF; color: #1C1B19; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Move</a>
    <a href="item-form.html" style="height: 54px; border-radius: 27px; background: #1C1B19; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Edit</a>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshot — New item</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6E6E}a:hover{color:#084A4A}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F4EF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1C1B19">
  <div style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="snap.html" aria-label="Cancel" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(28,27,25,0.08)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">New item</h1>
    </div>
    <div role="tablist" aria-label="What to create" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 24px; background: #ECE8DF">
      <button role="tab" aria-selected="true" style="height: 40px; border-radius: 20px; border: 0; background: #FFFFFF; color: #1C1B19; font-size: 14px; font-weight: 700; box-shadow: 0 1px 2px rgba(28,27,25,0.1)">Item</button>
      <a href="location-form.html" role="tab" aria-selected="false" style="height: 40px; border-radius: 20px; color: #5F5B53; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Place</a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 10px">
        <div style="position: relative; width: 84px; height: 84px; border-radius: 18px; background: #9DB8B3">
          <button aria-label="Main photo" style="position: absolute; left: 6px; bottom: 6px; width: 28px; height: 28px; border-radius: 14px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10A4 4 0 0 1 12 7.5 4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="#0F6E6E"></path></svg>
          </button>
          <button aria-label="Remove photo" style="position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 13px; border: 2px solid #F6F4EF; background: #1C1B19; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <div style="position: relative; width: 84px; height: 84px; border-radius: 18px; background: #B8B09F">
          <button aria-label="Make this the main photo" style="position: absolute; left: 6px; bottom: 6px; width: 28px; height: 28px; border-radius: 14px; border: 0; background: rgba(255,255,255,0.85); display: flex; align-items: center; justify-content: center; padding: 0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2" aria-hidden="true"><path d="M12 20s-7-4.4-7-10A4 4 0 0 1 12 7.5 4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
          </button>
          <button aria-label="Remove photo" style="position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 13px; border: 2px solid #F6F4EF; background: #1C1B19; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <a href="snap.html" aria-label="Add more photos" style="width: 84px; height: 84px; border-radius: 18px; border: 2px dashed #B9B2A4; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #5F5B53">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </a>
      </div>
      <span style="font-size: 12px; color: #5F5B53">2 of 10 photos · the filled heart marks the main photo</span>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700">Name</span>
      <input value="Winter tyres" style="height: 52px; padding: 0 16px; border-radius: 16px; border: 2px solid #0F6E6E; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #1C1B19; outline: 0">
    </label>
    <div style="display: flex; gap: 10px">
      <div style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 700">Quantity</span>
        <div style="height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 4px; border-radius: 16px; background: #FFFFFF">
          <button aria-label="Decrease quantity" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #F0ECE4; font-size: 20px; color: #1C1B19">−</button>
          <span style="width: 32px; text-align: center; font-size: 18px; font-weight: 800">4</span>
          <button aria-label="Increase quantity" style="width: 44px; height: 44px; border-radius: 12px; border: 0; background: #0F6E6E; font-size: 20px; color: #FFFFFF">+</button>
        </div>
      </div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 13px; font-weight: 700">Place</span>
        <a href="pick-location.html" style="height: 52px; padding: 0 14px; border-radius: 16px; background: #FFFFFF; color: #1C1B19; text-decoration: none; display: flex; align-items: center; gap: 8px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F6E6E" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
          <span style="flex: 1; min-width: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Garage › Shelf 2</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F5B53" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </a>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 700">Tags <span style="font-weight: 500; color: #5F5B53">· 2 of 5</span></span>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; border-radius: 16px; background: #FFFFFF">
        <span style="height: 34px; padding: 0 6px 0 12px; border-radius: 17px; background: #0277BD; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px">Car
          <button aria-label="Remove tag Car" style="width: 24px; height: 24px; border-radius: 12px; border: 0; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; padding: 0"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </span>
        <span style="height: 34px; padding: 0 6px 0 12px; border-radius: 17px; background: #4E342E; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px">Seasonal
          <button aria-label="Remove tag Seasonal" style="width: 24px; height: 24px; border-radius: 12px; border: 0; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; padding: 0"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </span>
        <input placeholder="Add or create a tag" aria-label="Add or create a tag" style="flex: 1; min-width: 120px; height: 34px; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px; color: #1C1B19">
      </div>
      <div style="display: flex; gap: 8px">
        <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #E4DFD4; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #1C1B19">+ Tools</button>
        <button style="height: 32px; padding: 0 12px; border-radius: 16px; border: 1px solid #E4DFD4; background: #FFFFFF; font-size: 13px; font-weight: 600; color: #1C1B19">+ Heavy</button>
      </div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700">Description <span style="font-weight: 500; color: #5F5B53">· optional</span></span>
      <textarea style="height: 88px; padding: 12px 16px; box-sizing: border-box; border-radius: 16px; border: 0; background: #FFFFFF; font-family: inherit; font-size: 15px; line-height: 1.5; color: #1C1B19; resize: none">205/55 R16 on steel rims.</textarea>
    </label>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 24px 20px; background: #F6F4EF; border-top: 1px solid #E4DFD4">
    <a href="location.html" style="height: 56px; border-radius: 28px; background: #0F6E6E; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Save item</a>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snapshot — Edit tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F6E6E}a:hover{color:#084A4A}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6F4EF; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1C1B19">
  <div style="padding: 20px 20px 0 20px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 12px">
      <a href="tags.html" aria-label="Cancel" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(28,27,25,0.08)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1B19" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">Edit tag</h1>
    </div>
    <div style="height: 120px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <span style="height: 44px; padding: 0 22px; border-radius: 22px; background: #0277BD; color: #FFFFFF; font-size: 18px; font-weight: 800; display: flex; align-items: center">Car</span>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 700">Name</span>
      <input value="Car" style="height: 52px; padding: 0 16px; border-radius: 16px; border: 2px solid #0F6E6E; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #1C1B19; outline: 0">
    </label>
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="padding: 0; margin-bottom: 10px; font-size: 13px; font-weight: 700">Colour</legend>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; justify-items: center">
          <button aria-label="Red" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #C62828; box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0">
          </button>
          <button aria-label="Pink" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #AD1457; box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0">
          </button>
          <button aria-label="Purple" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #6A1B9A; box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0">
          </button>
          <button aria-label="Indigo" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #283593; box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0">
          </button>
          <button aria-label="Blue" style="width: 52px; height: 52px; border-radius: 26px; border: 3px solid #F6F4EF; background: #0277BD; box-shadow: 0 0 0 3px #1C1B19; display: flex; align-items: center; justify-content: center; padding: 0">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          </button>
          <button aria-label="Teal" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #00695C; box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0">
          </button>
          <button aria-label="Green" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #2E7D32; box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0">
          </button>
          <button aria-label="Orange" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #EF6C00; box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0">
          </button>
          <button aria-label="Brown" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #4E342E; box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0">
          </button>
          <button aria-label="Blue grey" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #37474F; box-shadow: none; display: flex; align-items: center; justify-content: center; padding: 0">
          </button>
      </div>
    </fieldset>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 20px; background: #FFFFFF">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">Used by 21 items</span>
        <span style="font-size: 13px; color: #5F5B53">Renaming updates all of them</span>
      </div>
      <a href="find-results.html" style="height: 40px; padding: 0 14px; border-radius: 20px; background: #DCEDEA; color: #0B5555; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center">Show items</a>
    </div>
    <button style="align-self: flex-start; height: 44px; padding: 0 4px; border: 0; background: transparent; color: #B3261E; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg>Delete tag</button>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 24px 20px; background: #F6F4EF; border-top: 1px solid #E4DFD4">
    <a href="tags.html" style="height: 56px; border-radius: 28px; background: #0F6E6E; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Save tag</a>
  </div>
</div>
</body>
</html>
